data:
  dataset_format: ur5e_task_folders

  agent_dir: /home/asus-mivia/Desktop/UR-Control/UR5e-2f-85/ai_controller/saved_rollouts/script_controller
  teacher_dir: /home/asus-mivia/Desktop/dataset/pick_place/human_rgb_pick_place

  train_tasks: ##solo verifica funzionamento loader
    - task_03
  test_tasks:
    - task_01

  T_context: 10
  agent_context: 0
  T_pair: 1

  height: 240
  width: 320
  crop: [0, 0, 0, 0]

  rand_crop: null
  rand_translate: null
  color_jitter: null
  rand_flip: false
  flip_sync: false
  sample_sides: true
  randomize_vid_frames: false
  no_context_jitter: true

  state_spec: []
  extra_samp_bound: 0.0
  traj_per_task: null
  target_vid: true
  waypoints: true

  teacher_image_keys:
    - camera_front_image

  agent_image_keys:
    - camera_front_image
    - front_camera_image

  eef_pos_key: eef_pos
  eef_quat_key: eef_quat
  gripper_qpos_key: gripper_qpos
  action_gripper_index: -1
  grasp_threshold: 0.5

  decode_compressed_images: true
  convert_bgr_to_rgb: true

  agent_convert_bgr_to_rgb: true
  teacher_convert_bgr_to_rgb: false

  projection_matrix_path: configs/ur5e_zed_front_projection.yaml

model:
  latent_dim: 256
  out_dim: 32
  waypoints: 5
  sub_waypoints: true
  ent_head: false
  num_ent_head: 2

training:
  num_epochs: 10
  downstream_num_epochs: 10
  batch_size: 4
  num_workers: 0
  valid_freq: 1
  mixup: false
  max_lr: 0.0002
  final_div_factor: 100
  ema:
    - 0.998
    - 1.0
  use_accelerate: true
  log_wandb: false